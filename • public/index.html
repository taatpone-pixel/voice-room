<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice Rooms</title>
  <style>
    body { font-family: Arial, sans-serif; background: #1b1b2f; color: #fff; margin: 0; padding: 20px; text-align: center; }
    .card { max-width: 420px; margin: 40px auto; background: #26264a; padding: 24px; border-radius: 16px; }
    input, button { font-size: 16px; padding: 12px; margin: 6px 0; width: 100%; box-sizing: border-box; border-radius: 8px; border: none; }
    button { background: #7c5cff; color: #fff; cursor: pointer; }
    button.danger { background: #e04b4b; }
    #users { list-style: none; padding: 0; }
    #users li { background: #33336a; margin: 6px 0; padding: 10px; border-radius: 8px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card" id="join-screen">
    <h2>Voice Rooms</h2>
    <input id="name" placeholder="Your name">
    <input id="room" placeholder="Room code">
    <button onclick="joinRoom()">Join Room</button>
  </div>

  <div class="card hidden" id="room-screen">
    <h2 id="room-title"></h2>
    <ul id="users"></ul>
    <button id="mute-btn" onclick="toggleMute()">Mute</button>
    <button class="danger" onclick="leaveRoom()">Leave</button>
  </div>

  <div id="audio-container"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
